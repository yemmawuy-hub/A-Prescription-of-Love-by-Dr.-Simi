<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Simi: A Prescription of Love</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
:root{--navy:#2A3652;--navy-deep:#1B2438;--orange:#C0600C;--btn:#A84800;--on-btn:#FFFFFF;--peach:#FCB490;--peach-soft:#FDE6D8;--bg:#FFF6EA;--paper:#FFFCF7;--ink:#1B2438;--muted:#586179;--line:#EBD9C4;--link:#1F5FA8;--danger:#A12B2B;--on-navy:#FFFFFF;--navy-accent:#F28C28;--shadow:0 8px 24px rgba(27,36,56,.10);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--navy:#2A3652;--navy-deep:#0F1524;--orange:#F28C28;--btn:#F28C28;--on-btn:#1B2438;--peach:#FCB490;--peach-soft:#2A3652;--bg:#151C2E;--paper:#1F2942;--ink:#F6EBDD;--muted:#B3BDD3;--line:#34415F;--link:#8DBBF5;--danger:#FF9A9A;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#2A3652;--navy-deep:#0F1524;--orange:#F28C28;--btn:#F28C28;--on-btn:#1B2438;--peach:#FCB490;--peach-soft:#2A3652;--bg:#151C2E;--paper:#1F2942;--ink:#F6EBDD;--muted:#B3BDD3;--line:#34415F;--link:#8DBBF5;--danger:#FF9A9A;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Outfit','Nunito',system-ui,sans-serif;font-weight:800;line-height:1.1;margin:0 0 10px;color:var(--ink)}
h1{font-size:32px;text-transform:uppercase;letter-spacing:.01em}h2{font-size:23px;text-transform:uppercase;letter-spacing:.02em}
p{margin:0 0 12px}
img{max-width:100%}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 56px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;background:var(--navy);border-radius:999px;padding:6px 8px 6px 12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--on-navy);font:800 18px 'Outfit',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.brand img{height:38px;width:auto}
.tag{font:700 13px 'Nunito',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-deep);background:var(--navy-accent);padding:6px 12px;border-radius:999px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}
.hero{background:var(--navy);color:var(--on-navy);border-radius:30px;padding:26px 22px 0;display:flex;flex-direction:column;gap:6px;overflow:hidden;position:relative}
.hero-row{display:flex;align-items:flex-end;gap:8px}
.hero-text{flex:1;padding-bottom:22px}
.hero h1{color:#fff;font-size:36px}
.hero .lead{color:#E6EAF5;font-size:18px;margin:10px 0 18px}
.hero-img{width:150px;height:auto;flex:none;align-self:flex-end}
.dots{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--navy-accent);opacity:.9}
.dots2{position:absolute;left:-26px;bottom:60px;width:70px;height:70px;border-radius:50%;background:var(--peach);opacity:.35}
.actions{display:flex;flex-direction:column;gap:10px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 24px;border-radius:999px;border:3px solid var(--btn);background:var(--btn);color:var(--on-btn);font:800 18px 'Outfit','Nunito',sans-serif;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none}
.btn.big{min-height:62px;font-size:20px}
.btn.secondary{background:transparent;color:var(--btn)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.hero .btn{background:var(--navy-accent);border-color:var(--navy-accent);color:var(--navy-deep)}
.hero .btn.secondary{background:transparent;color:#fff;border-color:#fff}
.btn:focus-visible,.link:focus-visible,.brand:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--link);font:700 16px 'Nunito',sans-serif;text-decoration:underline;cursor:pointer;padding:6px 0}
.mus{color:var(--orange);margin:0 0 12px;line-height:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;font:800 20px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid var(--navy)}
.steps b{display:block;font-family:'Outfit',sans-serif;font-size:19px}
.board{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.board li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--peach-soft);border-radius:16px}
.bn{font-weight:800}.bs{color:var(--muted);white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:15px}
.lead{font-size:19px}
.center{text-align:center}
.eyebrow{font:800 14px 'Outfit',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:16px 0 2px}
.value{font:800 66px/1.05 'Outfit',sans-serif;color:var(--orange);margin:0 0 6px}
.frame{border:6px solid var(--navy);border-radius:20px;background:#fff;overflow:hidden;line-height:0}
.frame img{width:100%;height:auto;display:block}
.frame.small{max-width:260px;margin:0 auto}
label{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],input[type=email],input[type=tel],input[type=number],select{width:100%;min-height:52px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px 'Nunito',sans-serif}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:700;margin:18px 0 8px}
.check input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--btn)}
.err{color:var(--danger);font-weight:800;min-height:24px;margin:8px 0}
.disclose{background:var(--peach-soft);border-radius:16px;padding:14px 16px;font-size:16px;color:var(--muted);margin-top:16px}
.cropbox{position:relative;overflow:hidden;border-radius:16px;background:#000;line-height:0}
.cropbox img{width:100%;height:auto;display:block}
.cropsel{position:absolute;border:3px dashed #F28C28;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);pointer-events:none}
.slider{display:flex;align-items:center;gap:12px;margin:8px 0}
.slider span{width:92px;font-weight:800;font-size:16px}
.slider input{flex:1;accent-color:var(--btn);min-height:36px}
.btnrow{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.linkbox{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.linkbox input{font-size:16px}
.how{background:var(--peach-soft);border-radius:16px;padding:14px 16px;font-size:16px;color:var(--muted);margin:14px 0 0}
.foot{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:15px;text-align:center}
.foot p{margin:0}
.overlay{position:fixed;inset:0;background:rgba(15,21,36,.78);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;overflow-y:auto}
.modal{background:var(--paper);color:var(--ink);border-radius:26px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);border:4px solid var(--navy);overflow:hidden}
.rx-head{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;font:700 14px 'Outfit',sans-serif;letter-spacing:.12em;text-transform:uppercase}
.rx-mark{font:800 34px/1 'Outfit',sans-serif;color:var(--navy-accent);letter-spacing:0}
.rx-body{padding:22px;text-align:center;border-top:3px dashed var(--peach)}
.rx-body .frame{max-width:200px;margin:0 auto 14px}
.rx-body h2{font-size:30px;color:var(--orange);text-transform:none;font-weight:800}
.rx-from{font-size:21px;margin:0 0 6px}
.rx-note{font:700 28px/1.1 'Caveat',cursive;color:var(--ink);margin:6px 0 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;text-align:center;border:2px solid var(--navy-accent)}
#toast.show{opacity:1}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:800}
.spin{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--muted)}
.spin::before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin::before{animation:none}#toast{transition:none}}
@media (max-width:420px){.hero-img{width:112px}.hero h1{font-size:30px}}
@media (min-width:560px){.actions,.btnrow{flex-direction:row}.actions .btn,.btnrow .btn{flex:1}.hero-img{width:190px}.hero h1{font-size:42px}}
</style>
</head>

const KEY='dsimi.prescription.v1';
const $=function(s,r){return (r||document).querySelector(s)};
const esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
const money=function(n){n=Number(n)||0;return '$'+n.toLocaleString('en-US',Number.isInteger(n)?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2})};
const plural=function(n,a,b){return n+' '+(n===1?a:b)};
function uid(){const a='abcdefghijklmnopqrstuvwxyz0123456789';const r=new Uint8Array(8);try{crypto.getRandomValues(r)}catch(e){for(let i=0;i<8;i++)r[i]=Math.floor(Math.random()*256)}let s='';for(let i=0;i<8;i++)s+=a[r[i]%36];return s}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||''}

/* ---------- storage (this browser only) ---------- */
let mem=null;
function load(){if(mem)return mem;let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}try{mem=raw?JSON.parse(raw):null}catch(e){mem=null}if(!mem||typeof mem!=='object'||!mem.drawings||!mem.links)mem={drawings:{},links:{}};return mem}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem));return true}catch(e){return false}}
function stats(did){const s=load();let shares=0,hops=0,visits=0;for(const k in s.links){const l=s.links[k];if(l.drawingId===did){shares++;visits+=l.clicks||0;if(l.hop>hops)hops=l.hop}}return {shares:shares,hops:hops,visits:visits}}
function chainText(st){return plural(st.hops,'hop','hops')+' · '+plural(st.shares,'link shared','links shared')+' · '+plural(st.visits,'shop visit','shop visits')}
function linkUrl(id){let base=BASE_URL;if(!base){try{base=location.href.split('#')[0]}catch(e){base=''}}return base+'#love-'+id}
/* the purchase link: the ref code is this share link's id, which maps back to one drawing */
function shopUrl(linkId,drawingId){const sep=SHOP_URL.indexOf('?')>-1?'&':'?';return SHOP_URL+sep+'ref='+encodeURIComponent(linkId)+'&utm_source=prescription-of-love&utm_medium=share&utm_campaign='+encodeURIComponent(drawingId)}
function createDrawing(img,f){const s=load();const id=uid(),linkId=uid(),now=new Date().toISOString();
  s.drawings[id]={id:id,img:img,guardian:f.guardian,child:f.child,email:f.email,phone:f.phone,consent:true,createdAt:now,total:0,gifts:[]};
  s.links[linkId]={id:linkId,drawingId:id,parent:null,hop:1,from:firstName(f.guardian),createdAt:now,clicks:0};
  if(!save()){delete s.drawings[id];delete s.links[linkId];return null}
  return {id:id,linkId:linkId}}
function shareLink(parentId,name){const s=load();const p=s.links[parentId];if(!p)return null;const id=uid();
  s.links[id]={id:id,drawingId:p.drawingId,parent:parentId,hop:p.hop+1,from:firstName(name),createdAt:new Date().toISOString(),clicks:0};save();return s.links[id]}
function creditOrder(drawingId,amt){const s=load();const d=s.drawings[drawingId];if(!d)return null;d.total=Math.round((d.total+amt)*100)/100;d.gifts.push({amount:amt,at:new Date().toISOString()});save();return d}

/* ---------- border detection ---------- */
function otsu(hist,total){let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sumB=0,wB=0,max=0,thr=100;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=total-wB;if(!wF)break;sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>max){max=v;thr=t}}return thr}
function longestRuns(mask,w,h,byRow){const outer=byRow?h:w,inner=byRow?w:h;const res=new Uint16Array(outer);
  for(let a=0;a<outer;a++){let run=0,gap=0,best=0;
    for(let b=0;b<inner;b++){const idx=byRow?a*w+b:b*w+a;
      if(mask[idx]){run+=1+gap;gap=0}else if(run>0){gap++;if(gap>4){run=0;gap=0}}
      if(run>best)best=run}
    res[a]=best}return res}
function clusters(runs,thr){const out=[];let s=-1,last=-1;
  for(let i=0;i<runs.length;i++){if(runs[i]>=thr){if(s<0)s=i;last=i}else if(s>=0&&i-last>2){out.push({s:s,e:last});s=-1}}
  if(s>=0)out.push({s:s,e:last});return out}
function detectFromGray(g,w,h){
  const hist=new Array(256).fill(0);for(let i=0;i<g.length;i++)hist[g[i]]++;
  let t=otsu(hist,g.length);t=Math.max(60,Math.min(t,120));
  const mask=new Uint8Array(g.length);for(let i=0;i<g.length;i++)mask[i]=g[i]<t?1:0;
  const rr=longestRuns(mask,w,h,true),cr=longestRuns(mask,w,h,false);
  let mr=0,mc=0;for(let i=0;i<rr.length;i++)if(rr[i]>mr)mr=rr[i];for(let i=0;i<cr.length;i++)if(cr[i]>mc)mc=cr[i];
  const hr=clusters(rr,Math.max(0.25*w,0.45*mr)),vr=clusters(cr,Math.max(0.25*h,0.45*mc));
  const cx=w/2,cy=h/2;let top=null,bottom=null,left=null,right=null;
  hr.forEach(function(c){if(c.e<cy&&(!top||c.e>top.e))top=c;if(c.s>cy&&(!bottom||c.s<bottom.s))bottom=c});
  vr.forEach(function(c){if(c.e<cx&&(!left||c.e>left.e))left=c;if(c.s>cx&&(!right||c.s<right.s))right=c});
  if(top&&bottom&&left&&right){const inset=3,x0=left.e+1+inset,x1=right.s-1-inset,y0=top.e+1+inset,y1=bottom.s-1-inset;
    if(x1-x0>0.25*w&&y1-y0>0.25*h)return {found:true,crop:{l:x0/w,t:y0/h,r:1-x1/w,b:1-y1/h}}}
  return {found:false,crop:{l:.08,t:.08,r:.08,b:.08}}}
function detectBorder(img){
  const maxD=700,s=Math.min(1,maxD/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);
  for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=Math.round(0.299*d[j]+0.587*d[j+1]+0.114*d[j+2]);
  return detectFromGray(g,w,h)}
function loadImage(file){return new Promise(function(res,rej){const url=URL.createObjectURL(file);const img=new Image();img.onload=function(){res(img)};img.onerror=function(){rej(new Error('load'))};img.src=url})}
function makeCrop(){const img=draft.img,c0=draft.crop,iw=img.naturalWidth,ih=img.naturalHeight;
  const sx=c0.l*iw,sy=c0.t*ih,sw=(1-c0.l-c0.r)*iw,sh=(1-c0.t-c0.b)*ih,sc=Math.min(1,720/Math.max(sw,sh));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*sc));c.height=Math.max(1,Math.round(sh*sc));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.82)}

/* ---------- sample drawing for demos ---------- */
function sampleDrawing(){
  const c=document.createElement('canvas');c.width=640;c.height=640;const g=c.getContext('2d');
  g.fillStyle='#FFFDF6';g.fillRect(0,0,640,640);g.lineCap='round';g.lineJoin='round';
  const ink='#4a3b2a';g.strokeStyle=ink;g.lineWidth=8;
  [['#F7C948',90,110,40],['#6EC1E4',560,120,34],['#F28C8C',70,540,30],['#8BD17C',570,530,36]].forEach(function(s){g.fillStyle=s[0];g.beginPath();g.arc(s[1],s[2],s[3],0,Math.PI*2);g.fill()});
  g.fillStyle='#F28C28';g.beginPath();g.moveTo(180,632);g.quadraticCurveTo(160,440,250,410);g.lineTo(390,410);g.quadraticCurveTo(480,440,460,632);g.closePath();g.fill();g.stroke();
  g.beginPath();g.moveTo(240,530);g.lineTo(400,530);g.lineTo(385,600);g.lineTo(255,600);g.closePath();g.stroke();
  g.fillStyle='#FFD3B0';g.beginPath();g.ellipse(320,260,120,135,0,0,Math.PI*2);g.fill();g.stroke();
  g.beginPath();g.moveTo(210,200);g.quadraticCurveTo(190,170,215,160);g.moveTo(430,200);g.quadraticCurveTo(450,170,425,160);g.stroke();
  g.fillStyle=ink;g.beginPath();g.arc(275,230,10,0,7);g.fill();g.beginPath();g.arc(365,230,10,0,7);g.fill();
  g.beginPath();g.moveTo(250,200);g.lineTo(300,195);g.moveTo(340,195);g.lineTo(390,200);g.stroke();
  g.fillStyle='#9AA0AA';g.beginPath();g.moveTo(320,298);g.quadraticCurveTo(250,268,195,322);g.quadraticCurveTo(250,350,320,326);g.quadraticCurveTo(390,350,445,322);g.quadraticCurveTo(390,268,320,298);g.fill();g.stroke();
  g.beginPath();g.arc(320,336,42,0.25,Math.PI-0.25);g.stroke();
  g.fillStyle='#FFD3B0';g.beginPath();g.arc(160,430,36,0,7);g.fill();g.stroke();g.beginPath();g.arc(480,430,36,0,7);g.fill();g.stroke();
  g.strokeStyle='#14213D';g.lineWidth=18;g.strokeRect(9,9,622,622);
  return c.toDataURL('image/jpeg',0.82)}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},3200)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}
function setHash(h){try{history.replaceState(null,'',h?('#'+h):(location.pathname+location.search))}catch(e){}}
function go(name){view=name;if(name==='home'||name==='admin')setHash('');render()}
function closeModal(){$('#modal-root').innerHTML=''}
function openModal(inner){const r=$('#modal-root');r.innerHTML='<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal">'+inner+'</div></div>';
  const btn=$('#mclose');if(btn){btn.onclick=closeModal;btn.focus()}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function header(tag){return '<header class="top"><button class="brand" data-go="home" aria-label="Back to the start"><img src="'+MASCOT+'" alt="" width="31" height="38"><span>Dr. Simi</span></button><span class="tag">'+(tag||'Prescription of Love')+'</span></header>'}
function wireGo(root){root.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go)}})}

  ({home:vHome,scan:vScan,crop:vCrop,details:vDetails,done:vDone,recipient:vRecipient,admin:vAdmin,missing:vMissing})[view](app);

    rows.map(function(r){return '<tr><td>'+esc(new Date(r.d.createdAt).toLocaleDateString())+'</td><td>'+esc(r.d.guardian)+'</td><td>'+esc(r.d.child)+'</td><td>'+esc(r.d.email)+'</td><td>'+esc(r.d.phone||'')+'</td><td>'+r.st.hops+'</td><td>'+r.st.visits+'</td><td>'+money(r.d.total)+'</td></tr>'}).join('')+'</table></div>':'<p class="muted">No sign-ups yet.</p>';
  const opts=rows.map(function(r){return '<option value="'+esc(r.d.id)+'">'+esc(r.d.child)+'’s Dr. Simi ('+esc(r.d.guardian)+')</option>'}).join('');
  app.innerHTML='<div class="wrap">'+header('Company')+'<section class="card"><h1>Company view (demo)</h1><div class="mus">'+MUSTACHE+'</div><p class="lead">Every opted-in parent, ready for newsletters. In the live version this page sits behind a login.</p>'+body+
  '<div class="btnrow"><button class="btn" id="csv"'+(rows.length?'':' disabled')+'>Copy as CSV</button><button class="btn danger" id="wipe">Clear demo data</button></div></section>'+
  '<section class="card"><h2>Credit an order (demo)</h2><div class="mus">'+MUSTACHE+'</div><p>In the live version the Dr. Simi shop sends this automatically when an order placed through a share link is paid. Use it here to see the value grow.</p>'+
  (rows.length?'<label for="crd">Drawing</label><select id="crd">'+opts+'</select><label for="cra">Order total (USD)</label><input id="cra" type="number" min="1" max="2000" step="0.01" inputmode="decimal"><div class="btnrow"><button class="btn" id="crgo">Credit this order</button></div>':'<p class="muted">Make a drawing first.</p>')+'</section>'+
  '<button class="link" data-go="home">Back</button></div>';
  $('#csv').onclick=async function(){const head=['created','guardian','child','email','phone','drawing_id','hops','links_shared','shop_visits','value_usd'];
    const lines=[head.join(',')].concat(rows.map(function(r){return [r.d.createdAt,r.d.guardian,r.d.child,r.d.email,r.d.phone,r.d.id,r.st.hops,r.st.shares,r.st.visits,r.d.total].map(csvCell).join(',')}));
    toast((await copyText(lines.join('\n')))?'CSV copied':'Copy did not work in this view.')};
  if(rows.length)$('#crgo').onclick=function(){const v=Number($('#cra').value);if(!(v>=1&&v<=2000)){toast('Enter an order total from $1 to $2,000.');return}
    const d=creditOrder($('#crd').value,v);if(d){toast(money(v)+' credited to '+d.child+'’s Dr. Simi');render()}};
  let armed=false;$('#wipe').onclick=function(){const b=$('#wipe');if(!armed){armed=true;b.textContent='Tap again to erase everything';setTimeout(function(){armed=false;b.textContent='Clear demo data'},4000);return}
    mem={drawings:{},links:{}};save();toast('Demo data cleared');render()}}

/* ---------- start ---------- */
function route(){let h='';try{h=location.hash||''}catch(e){}const m=/^#love-([a-z0-9]{6,12})$/.exec(h);
  if(!m)return false;const s=load();if(s.links[m[1]]){current={linkId:m[1]};view='recipient'}else{view='missing'}render();return true}
window.addEventListener('hashchange',function(){if(!route()){view='home';render()}});
if(!route())render();
})();
</script>
